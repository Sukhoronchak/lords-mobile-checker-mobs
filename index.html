<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lords Mobile — Аналіз Полювання</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="border-b border-slate-700 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-amber-400">🛡️ Lords Mobile — Полювання</h1>
                <p class="text-slate-400 text-sm">Перевірка норми монстрів та керування боржниками</p>
            </div>
            <span class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700">Client-Side (100% Безпечно)</span>
        </header>

        <!-- Control Panel -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- File Upload -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 md:col-span-2">
                <label class="block text-sm font-medium text-slate-300 mb-2">Обрати .xlsx файл бота</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" 
                    class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-900 hover:file:bg-amber-400 cursor-pointer">
            </div>

            <!-- Target Norm -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label for="normInput" class="block text-sm font-medium text-slate-300 mb-2">Норма очок (для розрахунку боргу)</label>
                <input type="number" id="normInput" value="42" min="1" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white font-bold focus:outline-none focus:border-amber-500">
            </div>
        </div>

        <!-- Stats Overview -->
        <div id="statsGrid" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                <p class="text-slate-400 text-xs">Активних гравців</p>
                <p id="statTotal" class="text-xl font-bold text-slate-100">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                <p class="text-slate-400 text-xs">Виконали норму</p>
                <p id="statSuccess" class="text-xl font-bold text-emerald-400">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                <p class="text-slate-400 text-xs">Боржники</p>
                <p id="statDebtors" class="text-xl font-bold text-rose-400">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                <p class="text-slate-400 text-xs">% Виконання</p>
                <p id="statPercent" class="text-xl font-bold text-amber-400">0%</p>
            </div>
        </div>

        <!-- Top 5 Hunters Section -->
        <div id="top5Section" class="hidden bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">🏆 ТОП-5 Мисливців Тижня</h2>
                <button id="copyTop5Btn" onclick="copyTop5List()" 
                    class="bg-amber-600 hover:bg-amber-500 text-slate-900 font-semibold text-xs px-3 py-1.5 rounded-lg transition-colors">
                    📋 Скопіювати ТОП-5
                </button>
            </div>
            <div id="top5List" class="grid grid-cols-1 sm:grid-cols-5 gap-3"></div>
        </div>

        <!-- Filters & Actions Panel -->
        <div id="actionsPanel" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <input type="text" id="searchInput" placeholder="Пошук за ніком..." 
                    class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-amber-500 w-48 sm:w-64">
                
                <select id="filterSelect" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-300 focus:outline-none">
                    <option value="all">Усі гравці</option>
                    <option value="debtors">Тільки боржники</option>
                    <option value="excluded">Виключені</option>
                </select>
            </div>

            <button id="copyBtn" onclick="copyDebtorsList()" 
                class="bg-rose-600 hover:bg-rose-500 text-white font-medium text-sm px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                📋 Скопіювати боржників для чату
            </button>
        </div>

        <!-- Table -->
        <div id="tableContainer" class="hidden bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 text-slate-400 uppercase text-xs border-b border-slate-700">
                        <tr>
                            <th class="px-4 py-3">Нікнейм</th>
                            <th class="px-4 py-3 text-center">Корегування</th>
                            <th class="px-4 py-3 text-center">Разом балів</th>
                            <th class="px-4 py-3 text-center">% Норми</th>
                            <th class="px-4 py-3 text-center">Борг</th>
                            <th class="px-4 py-3 text-center">Статус</th>
                            <th class="px-4 py-3 text-center">Дія</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700/50"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let parsedData = [];
        let manualAdjustments = {}; 
        let excludedPlayers = new Set(); 

        document.getElementById('excelFile').addEventListener('change', handleFile);
        document.getElementById('normInput').addEventListener('input', renderData);
        document.getElementById('searchInput').addEventListener('input', renderData);
        document.getElementById('filterSelect').addEventListener('change', renderData);

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                
                const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                if (rawRows.length < 2) return;

                let nameColIdx = 1;   // Стовпець B
                let pointsColIdx = 18; // Стовпець S
                let percentColIdx = 19; // Стовпець T

                for (let r = 0; r < Math.min(rawRows.length, 5); r++) {
                    const row = rawRows[r];
                    for (let c = 0; c < row.length; c++) {
                        const cellVal = String(row[c]).trim().toLowerCase();
                        if (cellVal === 'user name' || cellVal === 'name') nameColIdx = c;
                        if (cellVal === 'points (hunt)' || cellVal === 'points') pointsColIdx = c;
                    }
                }

                parsedData = [];
                manualAdjustments = {};
                excludedPlayers.clear();

                for (let i = 0; i < rawRows.length; i++) {
                    const row = rawRows[i];
                    if (!row || row.length <= nameColIdx) continue;

                    const rawName = String(row[nameColIdx] || "").trim();
                    
                    if (!rawName || 
                        rawName.toLowerCase() === 'user name' || 
                        rawName.toLowerCase() === 'name' ||
                        rawName.toLowerCase().includes('total') || 
                        rawName.toLowerCase().includes('user id')) {
                        continue;
                    }

                    const basePoints = parseFloat(row[pointsColIdx]) || 0;

                    // --- ВИПРАВЛЕНИЙ ПАРСИНГ ВІДСОТКІВ ---
                    let rawPercentStr = String(row[percentColIdx] || "").replace('%', '').trim();
                    let filePercent = parseFloat(rawPercentStr);
                    
                    if (!isNaN(filePercent)) {
                        // Якщо значення <= 5 (наприклад, 1, 0.95, 1.05), множимо на 100
                        if (filePercent <= 5) {
                            filePercent = Math.round(filePercent * 100);
                        } else {
                            filePercent = Math.round(filePercent);
                        }
                    } else {
                        filePercent = 0;
                    }

                    parsedData.push({
                        id: parsedData.length,
                        name: rawName,
                        basePoints: basePoints,
                        filePercent: filePercent
                    });
                }

                document.getElementById('actionsPanel').classList.remove('hidden');
                document.getElementById('statsGrid').classList.remove('hidden');
                document.getElementById('top5Section').classList.remove('hidden');
                document.getElementById('tableContainer').classList.remove('hidden');

                renderData();
            };
            reader.readAsArrayBuffer(file);
        }

        function updateAdjustment(playerId, value) {
            manualAdjustments[playerId] = parseFloat(value) || 0;
            renderData();
        }

        function toggleExclude(playerId) {
            if (excludedPlayers.has(playerId)) {
                excludedPlayers.delete(playerId);
            } else {
                excludedPlayers.add(playerId);
            }
            renderData();
        }

        function getProcessedData() {
            const norm = parseFloat(document.getElementById('normInput').value) || 1;
            
            return parsedData.map(player => {
                const adj = manualAdjustments[player.id] || 0;
                const totalPoints = Math.max(0, player.basePoints + adj);
                const isExcluded = excludedPlayers.has(player.id);
                const isDebtor = !isExcluded && totalPoints < norm;
                
                const deficit = isDebtor ? norm - totalPoints : 0;
                
                // Якщо вручну змінювали бали — перераховуємо відсоток за новою формулою.
                // Якщо бали не змінювали — беремо динамічно розрахований відсоток (або значення з файлу)
                const percent = Math.round((totalPoints / norm) * 100);

                return { ...player, adj, totalPoints, isDebtor, isExcluded, deficit, percent };
            });
        }

        function renderData() {
            if (!parsedData.length) return;

            const processed = getProcessedData();
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterMode = document.getElementById('filterSelect').value;

            const activePlayers = processed.filter(p => !p.isExcluded);
            let debtorsCount = 0;
            let successCount = 0;

            activePlayers.forEach(p => {
                if (p.isDebtor) debtorsCount++;
                else successCount++;
            });

            // Update Stats
            document.getElementById('statTotal').innerText = activePlayers.length;
            document.getElementById('statSuccess').innerText = successCount;
            document.getElementById('statDebtors').innerText = debtorsCount;
            document.getElementById('statPercent').innerText = activePlayers.length ? Math.round((successCount / activePlayers.length) * 100) + '%' : '0%';

            // Render Top 5
            const top5 = [...activePlayers].sort((a, b) => b.totalPoints - a.totalPoints).slice(0, 5);
            const top5Container = document.getElementById('top5List');
            const medalEmojis = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];

            top5Container.innerHTML = top5.map((p, idx) => `
                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700/60 text-center flex flex-col justify-between">
                    <span class="text-xl mb-1">${medalEmojis[idx]}</span>
                    <p class="font-bold text-amber-300 text-sm truncate" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</p>
                    <p class="text-emerald-400 font-extrabold text-base mt-1">${p.percent}%</p>
                    <p class="text-slate-400 text-xs">${p.totalPoints} балів</p>
                </div>
            `).join('');

            // Filter for display table
            let filtered = processed.filter(p => p.name.toLowerCase().includes(searchTerm));
            if (filterMode === 'debtors') {
                filtered = filtered.filter(p => p.isDebtor);
            } else if (filterMode === 'excluded') {
                filtered = filtered.filter(p => p.isExcluded);
            }

            filtered.sort((a, b) => a.totalPoints - b.totalPoints);

            // Render Table Rows
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = filtered.map(p => `
                <tr class="hover:bg-slate-700/30 transition-colors ${p.isExcluded ? 'opacity-50 bg-slate-900/40' : ''}">
                    <td class="px-4 py-3 font-medium text-white ${p.isExcluded ? 'line-through text-slate-500' : ''}">${escapeHtml(p.name)}</td>
                    <td class="px-4 py-3 text-center">
                        <input type="number" value="${p.adj !== 0 ? p.adj : ''}" placeholder="0" 
                            ${p.isExcluded ? 'disabled' : ''}
                            onchange="updateAdjustment(${p.id}, this.value)"
                            class="w-20 bg-slate-900 border ${p.adj < 0 ? 'border-rose-500 text-rose-400' : p.adj > 0 ? 'border-emerald-500 text-emerald-400' : 'border-slate-700 text-slate-300'} rounded text-center px-2 py-1 text-xs focus:outline-none focus:border-amber-500 disabled:opacity-50">
                    </td>
                    <td class="px-4 py-3 text-center font-bold ${p.isExcluded ? 'text-slate-500' : p.isDebtor ? 'text-rose-400' : 'text-emerald-400'}">${p.totalPoints}</td>
                    <td class="px-4 py-3 text-center font-semibold ${p.isExcluded ? 'text-slate-500' : 'text-amber-300'}">${p.percent}%</td>
                    <td class="px-4 py-3 text-center font-bold ${p.deficit > 0 ? 'text-rose-400' : 'text-slate-500'}">${p.deficit}</td>
                    <td class="px-4 py-3 text-center">
                        ${p.isExcluded 
                            ? `<span class="bg-slate-700/30 text-slate-400 border border-slate-600 text-xs px-2.5 py-1 rounded-full font-semibold">Виключено</span>`
                            : p.isDebtor 
                            ? `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs px-2.5 py-1 rounded-full font-semibold">Боржник</span>` 
                            : `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-2.5 py-1 rounded-full font-semibold">ОК</span>`}
                    </td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="toggleExclude(${p.id})" 
                            class="text-xs px-2.5 py-1 rounded border transition-colors ${p.isExcluded ? 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600' : 'bg-rose-950/40 border-rose-800/60 text-rose-300 hover:bg-rose-900/60'}">
                            ${p.isExcluded ? '↩️ Відновити' : '🚫 Виключити'}
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function copyDebtorsList() {
            const norm = parseFloat(document.getElementById('normInput').value) || 1;
            const processed = getProcessedData();
            const debtors = processed
                .filter(p => p.isDebtor)
                .sort((a, b) => a.totalPoints - b.totalPoints);

            if (!debtors.length) {
                alert('Боржників не знайдено!');
                return;
            }

            let text = `⚠️ *СПИСОК БОРЖНИКІВ ПО МОНСТРАХ (Норма: ${norm})*\n`;
            text += `----------------------------------\n`;
            debtors.forEach((d) => {
                text += `${d.name} – ${d.deficit}\n`;
            });
            text += `----------------------------------\n`;
            text += `Всього боржників: ${debtors.length} осіб.`;

            copyToClipboard(text, 'copyBtn', '📋 Скопіювати боржників для чату');
        }

        function copyTop5List() {
            const processed = getProcessedData();
            const top5 = processed
                .filter(p => !p.isExcluded)
                .sort((a, b) => b.totalPoints - a.totalPoints)
                .slice(0, 5);

            if (!top5.length) return;

            let text = `🏆 *ТОП-5 МИСЛИВЦІВ ТИЖНЯ*\n`;
            text += `----------------------------------\n`;
            const medalEmojis = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
            top5.forEach((p, i) => {
                text += `${medalEmojis[i]} ${p.name} – ${p.percent}%\n`;
            });
            text += `----------------------------------\n`;
            text += `Вітаємо найкращих мисливців! 👏🎉`;

            copyToClipboard(text, 'copyTop5Btn', '📋 Скопіювати ТОП-5');
        }

        function copyToClipboard(text, btnId, defaultText) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById(btnId);
                btn.innerText = '✅ Скопійовано!';
                setTimeout(() => {
                    btn.innerText = defaultText;
                }, 2000);
            });
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
